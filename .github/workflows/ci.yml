name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Contracts sync, migrate, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oracledesk
          POSTGRES_PASSWORD: oracledesk
          POSTGRES_DB: oracledesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oracledesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI service credentials, not secrets.
      DATABASE_URL: postgresql://oracledesk:oracledesk@localhost:5432/oracledesk
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      CHAIN_EXECUTION_MODE: dry-run
      INDEXER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated contract code matches the submodule
        run: npm run check:contracts

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify schema datamodel matches migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Audit database constraints
        run: npx tsx scripts/audit-constraints.ts --json audit.json
      - run: npm run build
      - run: npm test

      - name: Migration compatibility (new migrations only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- prisma/migrations || true)"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed" | xargs node scripts/check-migration-compat.mjs
          else
            echo "No migration files changed"
          fi

  lint-workflows:
    name: Workflow and script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          additional_files: ./scripts/backup.sh ./scripts/restore.sh
